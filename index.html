<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Energy Monitor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page-minimal">
    <div class="login-container-minimal">
      <div class="login-box-minimal" data-aos="fade-up">
        <div class="login-brand-minimal">
          <i class="bi bi-lightning-charge-fill"></i>
          <h1>Energy Monitor</h1>
        </div>
        <form id="loginForm" class="login-form-minimal">
          <div class="input-group-minimal">
            <i class="bi bi-person"></i>
            <input
              type="text"
              id="username"
              placeholder="Username"
              required
              autocomplete="username" />
          </div>
          <div class="input-group-minimal">
            <i class="bi bi-lock"></i>
            <input
              type="password"
              id="password"
              placeholder="Password"
              required
              autocomplete="current-password" />
            <button type="button" class="password-eye" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <button type="submit" class="btn-login-minimal">
            Masuk
            <i class="bi bi-arrow-right ms-2"></i>
          </button>
          <div class="login-hint-minimal">
            username: <code>admin</code> atau <code>user</code><br />
            password: <code>admin123</code> atau <code>user123</code>
          </div>
        </form>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
