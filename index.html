<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - Monitoring Energi</title>
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <!-- Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        />
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <!-- AOS - Animate On Scroll Library -->
        <link
            href="https://unpkg.com/aos@2.3.1/dist/aos.css"
            rel="stylesheet"
        />
        <style>
            body {
                font-family: "Poppins", sans-serif;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #4a8eff, #5e60ce);
            }

            .login-card {
                max-width: 450px;
                width: 90%;
                border-radius: 16px;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(10px);
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                transition: all 0.3s ease;
            }

            .login-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            }

            .login-header {
                background: #5e60ce;
                padding: 30px 0;
                color: white;
                text-align: center;
                position: relative;
            }

            .login-header .icon {
                font-size: 3rem;
                margin-bottom: 10px;
            }

            .card-body {
                padding: 40px;
            }

            .form-floating > label {
                color: #666;
            }

            .form-floating .form-control {
                border-radius: 10px;
                height: 60px;
                border: 2px solid #e1e1e1;
            }

            .form-floating .form-control:focus {
                border-color: #5e60ce;
                box-shadow: 0 0 0 0.25rem rgba(94, 96, 206, 0.25);
            }

            .btn-primary {
                background: #5e60ce;
                border: none;
                border-radius: 10px;
                padding: 12px;
                font-weight: 600;
                letter-spacing: 1px;
                transition: all 0.3s ease;
            }

            .btn-primary:hover {
                background: #4a4bc2;
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(94, 96, 206, 0.4);
            }

            .form-check-input:checked {
                background-color: #5e60ce;
                border-color: #5e60ce;
            }

            .password-toggle {
                position: absolute;
                right: 15px;
                top: 18px;
                cursor: pointer;
                color: #666;
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div
                class="login-card mx-auto"
                data-aos="fade-up"
                data-aos-duration="800"
            >
                <div class="login-header">
                    <div class="icon" data-aos="zoom-in" data-aos-delay="300">
                        <i class="bi bi-lightning-charge-fill"></i>
                    </div>
                    <h2 class="fw-bold">Energy Monitoring</h2>
                    <p class="mb-0">Masuk untuk mengakses dashboard</p>
                </div>
                <div class="card-body">
                    <form id="loginForm">
                        <div class="form-floating mb-4">
                            <input
                                type="text"
                                class="form-control"
                                id="username"
                                placeholder="username"
                                required
                            />
                            <label for="username"
                                ><i class="bi bi-person me-2"></i
                                >Username</label
                            >
                        </div>

                        <div class="form-floating mb-3 position-relative">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="password"
                                required
                            />
                            <i
                                class="bi bi-eye password-toggle"
                                id="togglePassword"
                            ></i>
                            <label for="password"
                                ><i class="bi bi-lock me-2"></i>Password</label
                            >
                        </div>

                        <div class="form-check mb-4">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="rememberMe"
                            />
                            <label class="form-check-label" for="rememberMe">
                                Ingat saya
                            </label>
                        </div>

                        <div class="d-grid">
                            <button
                                type="submit"
                                class="btn btn-primary btn-lg"
                            >
                                <span class="me-2">Masuk</span>
                                <i class="bi bi-box-arrow-in-right"></i>
                            </button>
                        </div>
                    </form>

                    <div id="alert-message" class="mt-4"></div>

                    <div class="text-center mt-4 text-muted">
                        <p class="mb-0">Demo: username "admin" atau "user"</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- AOS JS -->
        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
        <!-- Custom JS -->
        <script>
            // Initialize AOS
            AOS.init();

            // Toggle password visibility
            document
                .getElementById("togglePassword")
                .addEventListener("click", function () {
                    const passwordInput = document.getElementById("password");
                    if (passwordInput.type === "password") {
                        passwordInput.type = "text";
                        this.classList.replace("bi-eye", "bi-eye-slash");
                    } else {
                        passwordInput.type = "password";
                        this.classList.replace("bi-eye-slash", "bi-eye");
                    }
                });

            // Handle login form submission
            document
                .getElementById("loginForm")
                .addEventListener("submit", function (event) {
                    event.preventDefault();

                    const username = document.getElementById("username").value;
                    const password = document.getElementById("password").value;
                    const alertMessage =
                        document.getElementById("alert-message");

                    // Show loading state
                    const submitBtn = this.querySelector(
                        'button[type="submit"]',
                    );
                    const originalBtnText = submitBtn.innerHTML;
                    submitBtn.innerHTML =
                        '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Loading...';
                    submitBtn.disabled = true;

                    // Simulate API call delay
                    setTimeout(() => {
                        // Simulasi logika login
                        if (username === "admin" && password) {
                            // Show success message before redirect
                            alertMessage.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Login berhasil! Mengalihkan ke dashboard admin...
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>`;

                            // Redirect after a brief delay
                            setTimeout(() => {
                                window.location.href = "dashboard-admin.html";
                            }, 1000);
                        } else if (username === "user" && password) {
                            // Show success message before redirect
                            alertMessage.innerHTML = `
                        <div class="alert alert-success alert-dismissible fade show" role="alert">
                            <i class="bi bi-check-circle-fill me-2"></i>Login berhasil! Mengalihkan ke dashboard pengguna...
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>`;

                            // Redirect after a brief delay
                            setTimeout(() => {
                                window.location.href = "dashboard-user.html";
                            }, 1000);
                        } else {
                            // Tampilkan pesan error
                            alertMessage.innerHTML = `
                        <div class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>Username atau password salah. Coba gunakan 'user' atau 'admin'.
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>`;

                            // Reset button state
                            submitBtn.innerHTML = originalBtnText;
                            submitBtn.disabled = false;
                        }
                    }, 800);
                });
        </script>
    </body>
</html>
