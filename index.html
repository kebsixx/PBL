<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Monitoring Energi</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="login-page">
    <div class="container">
      <div
        class="login-card mx-auto"
        data-aos="fade-up"
        data-aos-duration="800">
        <div class="login-header">
          <div class="icon" data-aos="zoom-in" data-aos-delay="300">
            <i class="bi bi-lightning-charge-fill"></i>
          </div>
          <h2 class="fw-bold">Energy Monitoring</h2>
          <p class="mb-0">Masuk untuk mengakses dashboard</p>
        </div>
        <div class="card-body">
          <form id="loginForm">
            <div class="form-floating mb-4">
              <input
                type="text"
                class="form-control"
                id="username"
                placeholder="username"
                required />
              <label for="username"
                ><i class="bi bi-person me-2"></i>Username</label
              >
            </div>
            <div class="form-floating mb-3 position-relative">
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="password"
                required />
              <i class="bi bi-eye password-toggle" id="togglePassword"></i>
              <label for="password"
                ><i class="bi bi-lock me-2"></i>Password</label
              >
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe"
                >Ingat saya</label
              >
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg">
                <span class="me-2">Masuk</span>
                <i class="bi bi-box-arrow-in-right"></i>
              </button>
            </div>
          </form>
          <div id="alert-message" class="mt-4"></div>
          <div class="text-center mt-4 text-muted">
            <p class="mb-0">Demo: username "admin" atau "user"</p>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
